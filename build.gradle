plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
    id 'eclipse'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    mavenCentral()
}

base {
    archivesName = mod_id
}

// Minecraft 1.21.1 targets Java 21
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // NeoForge version specified in gradle.properties (21.1.215)
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // Default run configurations for development
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Add additional dependencies here
}

// Expands declared replace properties in src/main/templates
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

var syncToBinMain = tasks.register('syncToBinMain', Sync) {
    dependsOn classes
    from sourceSets.main.output
    into 'bin/main'
}

// Resolves Windows NTFS junctions/symlinks (e.g. Scoop's apps\gradle\current\.gradle -> persist\gradle\.gradle)
// in generated ModDevGradle argument and classpath files so they match the canonicalized paths on the IDE classpath.
var canonicalizeModDevPaths = tasks.register('canonicalizeModDevPaths') {
    var moddevDir = layout.buildDirectory.dir('moddev')
    var rawHome = gradle.gradleUserHomeDir.absolutePath
    var realHome = gradle.gradleUserHomeDir.toPath().toRealPath().toString()
    doLast {
        if (rawHome != realHome) {
            var rawEscaped = rawHome.replace('\\', '\\\\')
            var realEscaped = realHome.replace('\\', '\\\\')
            var dir = moddevDir.get().asFile
            if (dir.exists()) {
                dir.eachFileMatch(~/.*\.(txt|xml|properties)/) { file ->
                    var content = file.getText('UTF-8')
                    var updated = content
                        .replace(rawEscaped, realEscaped)
                        .replace(rawHome, realHome)
                    if (updated != content) {
                        file.setText(updated, 'UTF-8')
                    }
                }
            }
        }
    }
}

var prepareRuns = tasks.matching {
    it.name.startsWith('prepare') && it.name.endsWith('Run')
}

tasks.matching {
    (it.name.startsWith('prepare') && it.name.endsWith('Run')) ||
    (it.name.startsWith('write') && it.name.endsWith('LegacyClasspath'))
}.configureEach {
    finalizedBy canonicalizeModDevPaths
}

tasks.withType(JavaExec).configureEach {
    doFirst {
        classpath = files(classpath.files.collect { it.toPath().toRealPath().toFile() })
    }
}

compileJava.finalizedBy syncToBinMain
processResources.finalizedBy syncToBinMain
classes.finalizedBy syncToBinMain, prepareRuns
neoForge.ideSyncTask syncToBinMain
neoForge.ideSyncTask canonicalizeModDevPaths

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
